name: CI

# Tasks covered:
#   T1-08  portable core tests on Linux, macOS and Windows
#           (all seven suites: core_tests, ec_protocol_tests, app_bridge_tests,
#            ecdiag_tests, legacy_policy_tests and legacy_backend_tests)
#           plus the ecdiag tool itself, built and smoke-tested
#   T1-09  Release build with warnings-as-errors on the core
#   T1-10  git diff --check and a link check
#   T1-11  Windows test target
#   T1-12  static analysis (MSVC /analyze)
#
# The legacy Win32 application can only be compiled on Windows, so the portable
# jobs deliberately do not build it. No job in this workflow touches hardware or
# loads a kernel driver.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- T1-08 ----
  portable-tests:
    name: Portable core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The same script is the single entry point on every platform. On Windows
      # it runs under the Git Bash that ships with the runner image.
      - name: Run portable core tests
        shell: bash
        run: ./tests/run_core_tests.sh

      - name: Run under AddressSanitizer and UndefinedBehaviorSanitizer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          BUILD_DIR="${TMPDIR:-/tmp}/tpfancontrol-core-san"
          mkdir -p "$BUILD_DIR"
          CXX="${CXX:-g++}"
          for suite in core_tests ec_protocol_tests app_bridge_tests \
                       ecdiag_tests legacy_policy_tests legacy_backend_tests; do
            # core_tests uses the fake backend; the EC suites use the fake EC.
            # legacy_policy_tests supplies its own doubles inline and needs no
            # fake. legacy_backend_tests does need fake_ec.cpp - for FakeClock,
            # not for the bus - so it is deliberately not in the no-fake case.
            #
            # This table is the thing scripts/check_ci_steps.py exists for. It
            # caught exactly this mistake: a suite that stopped linking because
            # its fake was moved to /dev/null, in a step that would otherwise
            # have failed four minutes into a CI run.
            case "$suite" in
              core_tests)          FAKE=tests/fake_backend.cpp ;;
              legacy_policy_tests) FAKE=/dev/null ;;
              *)                   FAKE=tests/fake_ec.cpp ;;
            esac
            # ec_protocol_tests and app_bridge_tests use std::thread for the transaction
            # serialisation tests, so a threading library is linked in.
            "$CXX" -std=c++17 -Wall -Wextra -Werror -pedantic \
              -fsanitize=address,undefined -fno-omit-frame-pointer -g \
              -I fancontrol/core -I tests \
              fancontrol/core/*.cpp \
              "$FAKE" \
              "tests/$suite.cpp" \
              -o "$BUILD_DIR/${suite}_san" \
              -pthread
            "$BUILD_DIR/${suite}_san"
          done

          # NDEBUG must not silently disable the assertions. Release defines it,
          # and an assert-based suite built with NDEBUG runs zero checks and
          # still exits 0, so this is verified rather than assumed.
          # See tests/test_check.h.
          for suite in core_tests ec_protocol_tests app_bridge_tests \
                       ecdiag_tests legacy_policy_tests legacy_backend_tests; do
            # core_tests uses the fake backend; the EC suites use the fake EC.
            # legacy_policy_tests supplies its own doubles inline and needs no
            # fake. legacy_backend_tests does need fake_ec.cpp - for FakeClock,
            # not for the bus - so it is deliberately not in the no-fake case.
            #
            # This table is the thing scripts/check_ci_steps.py exists for. It
            # caught exactly this mistake: a suite that stopped linking because
            # its fake was moved to /dev/null, in a step that would otherwise
            # have failed four minutes into a CI run.
            case "$suite" in
              core_tests)          FAKE=tests/fake_backend.cpp ;;
              legacy_policy_tests) FAKE=/dev/null ;;
              *)                   FAKE=tests/fake_ec.cpp ;;
            esac
            "$CXX" -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -pedantic \
              -I fancontrol/core -I tests \
              fancontrol/core/*.cpp \
              "$FAKE" \
              "tests/$suite.cpp" \
              -o "$BUILD_DIR/${suite}_ndebug" \
              -pthread
            "$BUILD_DIR/${suite}_ndebug"
          done

  # ---------------------------------------------------------------- T1-11 ----
  windows-build:
    name: Windows ${{ matrix.configuration }}|${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Show toolset
        run: msbuild -version

      - name: Build solution
        run: >
          msbuild fancontrol/fancontrol.sln
          /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /v:normal
          /nologo
          /fl /flp:LogFile=build-${{ matrix.configuration }}-${{ matrix.platform }}.log;Verbosity=normal

      # The core is compiled with /W4 /WX, so this step fails the job on any new
      # core warning. Legacy sources are /W4 but warning-only until their
      # baseline is clean (task T1-05).
      - name: Run Windows test target
        shell: cmd
        run: |
          out\tests\${{ matrix.platform }}\${{ matrix.configuration }}\core_tests.exe
          out\tests\${{ matrix.platform }}\${{ matrix.configuration }}\ec_protocol_tests.exe
            out\tests\${{ matrix.platform }}\${{ matrix.configuration }}\app_bridge_tests.exe
            out\tests\${{ matrix.platform }}\${{ matrix.configuration }}\ecdiag_tests.exe
            out\tests\${{ matrix.platform }}\${{ matrix.configuration }}\legacy_policy_tests.exe
            out\tests\${{ matrix.platform }}\${{ matrix.configuration }}\legacy_backend_tests.exe

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.configuration }}-${{ matrix.platform }}
          path: build-${{ matrix.configuration }}-${{ matrix.platform }}.log
          if-no-files-found: warn

  # ---------------------------------------------------------------- T1-09 ----
  release-warnings-as-errors:
    name: Release core, warnings as errors
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build Release test targets with warnings-as-errors
        run: >
          msbuild tests\core_tests.vcxproj tests\ec_protocol_tests.vcxproj
                        tests\app_bridge_tests.vcxproj tests\ecdiag_tests.vcxproj
                        tests\legacy_policy_tests.vcxproj
                        tests\legacy_backend_tests.vcxproj
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:TreatWarningAsError=true
          /p:RunCodeAnalysis=false
          /nologo
          /v:normal
          /fl /flp:LogFile=build-core-wx.log;Verbosity=normal

      - name: Run tests
        shell: cmd
        run: |
          out\tests\x64\Release\core_tests.exe
          out\tests\x64\Release\ec_protocol_tests.exe
            out\tests\x64\Release\app_bridge_tests.exe
            out\tests\x64\Release\ecdiag_tests.exe
            out\tests\x64\Release\legacy_policy_tests.exe
            out\tests\x64\Release\legacy_backend_tests.exe

      - name: Confirm the core really was compiled with /W4 and /WX
        # Guards against the flag silently not being applied, which would make
        # this job pass vacuously. Fails if a core translation unit is seen
        # without both flags.
        shell: pwsh
        run: |
          $log = Get-Content build-core-wx.log -Raw
          $coreUnits = @('core_types', 'sensor_validation', 'fan_curve', 'controller', 'io_backend', 'ec_access', 'ec_protocol', 'ecdiag', 'app_bridge', 'legacy_policy', 'legacy_backend')
          $fail = @()
          foreach ($u in $coreUnits) {
            $lines = $log -split "`r?`n" | Where-Object { $_ -match "$u\.cpp" -and $_ -match '\bcl\.exe\b|compiler' }
            if (-not $lines) { $fail += "$u.cpp : no compile line found in the log"; continue }
            $joined = $lines -join "`n"
            if ($joined -notmatch '/W4')          { $fail += "$u.cpp : /W4 not present" }
            if ($joined -notmatch '/WX')          { $fail += "$u.cpp : /WX not present" }
            if ($joined -notmatch '/permissive-') { $fail += "$u.cpp : /permissive- not present" }
            if ($joined -notmatch '/EHsc')        { $fail += "$u.cpp : /EHsc not present" }
          }
          if ($fail) {
            $fail | ForEach-Object { "::error::$_" }
            exit 1
          }
          Write-Host "all $($coreUnits.Count) core units compiled with /W4 /WX /permissive- /EHsc"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-warnings-as-errors-log
          path: build-core-wx.log
          if-no-files-found: warn

  # ---------------------------------------------------------------- T1-10 ----
  hygiene:
    name: Repository hygiene and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Whitespace errors (git diff --check)
        run: |
          set -eu
          # --check against the merge base, since a plain `git diff --check`
          # compares the working tree to HEAD and would see no staged changes.
          if git rev-parse --verify "origin/${{ github.base_ref || 'main' }}" >/dev/null 2>&1; then
            git diff --check "origin/${{ github.base_ref || 'main' }}...HEAD"
          else
            git diff --check HEAD~1 HEAD || git diff --check
          fi

      - name: Solution and project structure
        # Catches a Project( with no EndProject, a project file that does not
        # exist, a vcxproj listing a source that is not on disk, and a project
        # that is not mapped into all four configurations. Every one of those
        # produces a build that is less than it appears to be, and none of them
        # is visible without a machine that has MSBuild.
        run: python3 scripts/check_projects.py

      - name: The legacy application writes no forbidden EC register
        # T3-11. The legacy SetFan() wrote 0x31, the fan-selector register, four
        # times per attempt and up to five attempts, with no check of any kind.
        # Those lines are removed, but nothing here can execute the function: it
        # is Win32 dialog code, and no test in tests/ runs it. So the regression
        # guard is static, and this is it.
        #
        # It also forbids a fan-level write from outside the core, which is what
        # stops the same write coming back through a different door.
        #
        # The self-test runs first and proves the guard still matches what it
        # claims to. A guard whose patterns have silently stopped matching
        # reports a clean tree and a green job, which is worse than having no
        # guard at all.
        run: |
          python3 scripts/check_legacy_ec_selftest.py
          python3 scripts/check_legacy_ec.py

      - name: Shell scripts start with a clean shebang
        # A UTF-8 BOM is invisible in an editor and fatal to /bin/sh: the kernel
        # reads the first two bytes as '#!', fails, and the script is
        # re-interpreted as shell source. It produces one confusing error line
        # and then runs anyway, which is worse than failing cleanly.
        run: |
          set -eu
          bad=0
          for f in $(git ls-files '*.sh'); do
            if ! head -c 2 "$f" | grep -q '#!'; then
              echo "::error::$f does not begin with a shebang (BOM or missing)"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
          echo "all shell scripts have a clean shebang"

      - name: The ecdiag tool cannot reach anything that writes
        # T5-09. ecdiag is read-only by construction: it is handed an interface
        # with one read operation and no write member, which holds only while its
        # include closure stays closed. One convenient include would put EcBus and
        # writeRegister back within reach, and nothing else in the build would say
        # so. This also refuses to pass if the runtime trace assertions in
        # tests/ecdiag_tests.cpp have been deleted, because a structural guarantee
        # whose runtime evidence is gone is a guarantee nobody is checking.
        #
        # The self-test runs first and proves the rules still match what they claim
        # to, which is the failure mode that has actually bitten this repository.
        run: |
          python3 scripts/check_ecdiag_readonly.py --selftest
          python3 scripts/check_ecdiag_readonly.py

      - name: Markdown link check
        run: python3 scripts/check_links.py

      - name: The portable steps of this workflow still work
        # ci/ci.yml is a program that nothing compiles and nothing runs until
        # GitHub does, so an edit to it is invisible until CI is red, on a
        # runner, in a job that took four minutes to reach the broken line. This
        # executes the POSIX steps of this file locally.
        #
        # It has already paid for itself: it found that the FAKE= selection in
        # the sanitizer jobs was wrong for one suite, and -- while being written
        # -- three classification bugs of its own, each of which had quietly
        # reduced how much was being checked.
        #
        # Windows steps are named and skipped, never silently dropped, so a step
        # cannot be excluded by being misclassified.
        run: python3 scripts/check_ci_steps.py

      - name: No build artifacts tracked
        run: |
          set -eu
          if git ls-files | grep -Ei '\.(obj|exe|pdb|ilk|pch|res|tlb|idb|exp|lib)$' \
             | grep -v '^fancontrol/TVicPort\.lib$'; then
            echo "::error::generated build artifacts are tracked in git"
            exit 1
          fi
          echo "no generated build artifacts tracked (TVicPort.lib is the reviewed vendor import)"

      - name: Every source file is valid UTF-8
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess, sys
          files = subprocess.check_output(
              ["git", "ls-files", "*.cpp", "*.h", "*.md", "*.yml", "*.py", "*.sh"],
              text=True).split()
          bad = []
          for f in files:
              data = open(f, "rb").read()
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  bad.append(f"{f}: {exc}")
          if bad:
              print("::error::files are not valid UTF-8:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print(f"all {len(files)} text source file(s) are valid UTF-8")
          PY

  # ---------------------------------------------------------------- T1-12 ----
  static-analysis:
    name: MSVC static analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Analyse the core
        run: >
          msbuild tests/core_tests.vcxproj tests/ec_protocol_tests.vcxproj
                        tests/app_bridge_tests.vcxproj tests/ecdiag_tests.vcxproj
                        tests/legacy_policy_tests.vcxproj
                        tests/legacy_backend_tests.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:RunCodeAnalysis=true
          /p:EnableCodeAnalysis=true
          /nologo
          /v:normal
          /fl /flp:LogFile=analyze-core.log;Verbosity=normal

      - name: Analyse the application
        # Warning-only: the legacy baseline is not clean yet (task T1-05), so
        # analysis findings are published rather than enforced.
        continue-on-error: true
        run: >
          msbuild fancontrol/fancontrol.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:RunCodeAnalysis=true
          /p:EnableCodeAnalysis=true
          /nologo
          /v:normal
          /fl /flp:LogFile=analyze-app.log;Verbosity=normal

      - name: Collect analysis findings
        if: always()
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Path . -Filter 'analyze-*.log' -ErrorAction SilentlyContinue
          $summary = foreach ($log in $logs) {
            $text = Get-Content $log.FullName -Raw
            [PSCustomObject]@{
              Log      = $log.Name
              Errors   = ([regex]::Matches($text, ': error ')).Count
              Warnings = ([regex]::Matches($text, ': warning ')).Count
            }
          }
          $summary | Format-Table | Out-String | Tee-Object -FilePath analysis-summary.txt

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            analyze-core.log
            analyze-app.log
            analysis-summary.txt
          if-no-files-found: warn
